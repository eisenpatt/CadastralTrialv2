<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>LGU Cadastral + Payment Dashboard</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<style>
body { margin:0; font-family: Arial, sans-serif; }
#map { height:100vh; }

.panel {
  position:absolute;
  top:10px;
  left:10px;
  width:360px;
  background:white;
  padding:10px;
  z-index:1000;
  border-radius:6px;
  box-shadow:0 0 6px rgba(0,0,0,0.3);
  font-size:12px;
}

.panel select {
  width:100%;
  padding:4px;
  margin-bottom:4px;
}

.counter {
  margin-top:4px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="panel">
  <h3>Filters</h3>
  <select id="PaymentStatusFilter">
    <option value="">All Payment Status</option>
    <option value="full">Fully Paid</option>
    <option value="partial">Partial Payment</option>
    <option value="unpaid">Unpaid</option>
  </select>

  <select id="Province_Code"></select>
  <select id="Municipality_Code"></select>
  <select id="Barangay_Code"></select>
  <select id="Section"></select>
  <select id="Classification_Code"></select>
  <select id="Improvements"></select>
  <select id="Land_Value_Code"></select>

  <hr>
  <div class="counter" id="paidCount"></div>
  <div class="counter" id="partialCount"></div>
  <div class="counter" id="unpaidCount"></div>
  <hr>
  <div class="counter" id="barangaySummary"></div>
</div>

<div id="map"></div>

<script>
// CONFIG
const geojsonURL = "cadastralv4.geojson";
const csvURL = "https://docs.google.com/spreadsheets/d/1z22DepDiHcjD4A_XgYy_Cb4Dw9mCmXhk8lcl71tMgEI/export?format=csv";

let map = L.map("map").setView([12.8797,121.7740],6);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

let parcelLayer;
let geojsonData;

// LOAD DATA
loadData();

function loadData() {
  Papa.parse(csvURL, {
    download:true,
    header:true,
    skipEmptyLines:true,
    complete: res => {
      let latest = {};
      res.data.forEach(r=>{
        if(!r.PIN || !r.Timestamp) return;
        let ts = new Date(r.Timestamp);
        if(!latest[r.PIN] || ts > new Date(latest[r.PIN].Timestamp)) {
          latest[r.PIN] = r;
        }
      });

      fetch(geojsonURL)
        .then(r=>r.json())
        .then(gj=>{
          gj.features.forEach(f=>{
            let row = latest[f.properties.PIN];
            if(row) Object.assign(f.properties,row);
          });
          geojsonData = gj;
          populateFilters();
          drawLayer();
        });
    }
  });
}

// FILTERS
const filterFields = ["Province_Code","Municipality_Code","Barangay_Code","Section",
                      "Classification_Code","Improvements","Land_Value_Code"];

function populateFilters() {
  filterFields.forEach(f=>{
    let sel = document.getElementById(f);
    sel.innerHTML = `<option value="">All ${f}</option>`;
    [...new Set(geojsonData.features.map(x=>x.properties[f]).filter(Boolean))]
      .sort()
      .forEach(v=> sel.innerHTML += `<option>${v}</option>`);
    sel.onchange = drawLayer;
  });
}

document.getElementById("PaymentStatusFilter").onchange = drawLayer;

// DRAW MAP
function drawLayer() {
  if(parcelLayer) map.removeLayer(parcelLayer);

  const statusFilter = document.getElementById("PaymentStatusFilter").value;

  let paid=0, partial=0, unpaid=0;
  let barangayCounts = {};

  parcelLayer = L.geoJSON(geojsonData,{
    filter: f => {
      let paidAmt = Number(f.properties.Amount_Paid || 0);
      let lotVal = Number(f.properties.Lot_Value || 0);
      let status = "unpaid";

      if(paidAmt >= lotVal && lotVal>0) status="full";
      else if(paidAmt>0 && paidAmt<lotVal) status="partial";

      f.properties._paymentStatus = status;

      // Barangay summary
      let b = f.properties.Barangay_Code || "Unknown";
      if(!barangayCounts[b]) barangayCounts[b]={full:0,partial:0,unpaid:0};
      barangayCounts[b][status]++;

      if(!statusFilter || statusFilter===status) return true;
      return false;
    },
    style: f => {
      let status = f.properties._paymentStatus;
      if(status==="full") return {color:"#006400", fillColor:"#00cc44", weight:1, fillOpacity:0.6};
      if(status==="partial") return {color:"#CCCC00", fillColor:"#FFFF66", weight:1, fillOpacity:0.6};
      return {color:"#8b0000", fillColor:"#ff3333", weight:1, fillOpacity:0.6};
    },
    onEachFeature: (f,l) => {
      let paidAmt = Number(f.properties.Amount_Paid || 0);
      let lotVal = Number(f.properties.Lot_Value || 0);
      let balance = lotVal - paidAmt;

      l.bindPopup(`
        <b>PIN:</b> ${f.properties.PIN}<br>
        <b>Parcel ID:</b> ${f.properties.Parcel_ID}<br>
        <b>Cadastral Lot No:</b> ${f.properties.Cadastral_Lot_No}<br>
        <b>Owner:</b> ${f.properties.Lot_Owner}<br>
        <b>Title:</b> ${f.properties.Title}<br>
        <b>Area (sq.m.):</b> ${f.properties.Area}<br>
        <b>Classification:</b> ${f.properties.Classification_Code}<br>
        <b>Improvements:</b> ${f.properties.Improvements}<br>
        <b>Land Value Code:</b> ${f.properties.Land_Value_Code}<br>
        <b>Lot Value:</b> ₱${lotVal.toLocaleString()}<br>
        <b>Amount Paid:</b> ₱${paidAmt.toLocaleString()}<br>
        <b>Balance:</b> ₱${balance.toLocaleString()}<br>
        <b>Last Updated:</b> ${new Date(f.properties.Timestamp).toLocaleString()}
      `);
    }
  }).addTo(map);

  // Counters
  geojsonData.features.forEach(f=>{
    switch(f.properties._paymentStatus) {
      case "full": paid++; break;
      case "partial": partial++; break;
      case "unpaid": unpaid++; break;
    }
  });

  document.getElementById("paidCount").innerHTML = `🟢 Fully Paid: ${paid}`;
  document.getElementById("partialCount").innerHTML = `🟡 Partial Payment: ${partial}`;
  document.getElementById("unpaidCount").innerHTML = `🔴 Unpaid: ${unpaid}`;

  // Barangay summary
  let summaryHTML = "<b>Barangay Summary</b><br>";
  for(let b in barangayCounts){
    let c = barangayCounts[b];
    summaryHTML += `${b}: 🟢${c.full} 🟡${c.partial} 🔴${c.unpaid}<br>`;
  }
  document.getElementById("barangaySummary").innerHTML = summaryHTML;
}
</script>

</body>
</html>
